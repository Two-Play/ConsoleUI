[package]
name = "consoleui-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The store of ConsoleUI: browse, install and remove apps from Flathub with a controller"

[dependencies]
consoleui-core.workspace = true
consoleui-sdk.workspace = true
flate2 = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
quick-xml = "0.41"
slint = "1.18.1"

[build-dependencies]
consoleui-ui = { workspace = true, features = ["build"] }
slint-build = "1.18.1"
