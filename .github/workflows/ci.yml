name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  shell-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev \
            libwayland-dev libxcb1-dev libx11-dev libgl1-mesa-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p consoleui-core -p consoleui --all-targets -- -D warnings
      - run: cargo test -p consoleui-core -p consoleui
