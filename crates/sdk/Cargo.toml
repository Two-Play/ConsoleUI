[package]
name = "consoleui-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What apps for ConsoleUI build on: the design system, input, hints, sounds and the session behind one API"

[features]
# `build::compile()` for an app's build script (needs slint-build)
build = ["consoleui-ui/build", "dep:slint-build"]

[dependencies]
consoleui-app.workspace = true
consoleui-core.workspace = true
consoleui-ui.workspace = true
png = "0.18.1"
slint = "1.18.1"
slint-build = { version = "1.18.1", optional = true }
