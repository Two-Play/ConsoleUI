# Flatpak build of the app (Story 8.5). Change the ID (here and the file name of the desktop entry it
# installs) to one of your own domain before you publish it.
#   flatpak-builder --user --install --force-clean build-dir @APP_ID@.yml
#   flatpak run @APP_ID@
# Needs the Rust extension once: flatpak install --user flathub org.freedesktop.Sdk.Extension.rust-stable//25.08
id: @APP_ID@
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: my-app
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Controllers: gilrs reads the evdev nodes and finds them without udev in the sandbox
  - --device=input
  # UI sounds through pw-cat
  - --filesystem=xdg-run/pipewire-0
  # The shell's settings and toasts (docs/sdk.md)
  - --talk-name=org.consoleui.Shell1
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/my-app/cargo
  # The ConsoleUI crates are not published yet: the build reads them from the checkout the app was
  # created from, and cargo fetches the other crates. Flathub needs vendored sources instead.
  build-args:
    - --share=network
    - --filesystem=@CONSOLEUI@:ro
modules:
  - name: my-app
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/my-app /app/bin/my-app
      - install -Dm644 my-app.desktop /app/share/applications/${FLATPAK_ID}.desktop
    sources:
      - type: dir
        path: .
        skip:
          - target
          - build-dir
          - .flatpak-builder
