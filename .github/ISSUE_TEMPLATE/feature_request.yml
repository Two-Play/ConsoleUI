name: Feature or idea
description: Suggest an improvement, a store feature or a home theater idea
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter on the couch?
      description: How would you use it with a controller?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Shell UI, Controller input, Compositor / session, Store, Gamepad-friendly apps, Home theater / streaming, Packaging, Docs, Other]
