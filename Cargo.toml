[workspace]
resolver = "3"
members = ["crates/core", "crates/ui", "crates/app", "crates/gallery", "crates/shell", "crates/compositor"]
# The compositor needs -devel packages the host does not have (see dev/toolbox.sh), so a plain
# `cargo build`/`cargo run` only builds the shell.
default-members = ["crates/shell"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
consoleui-core = { path = "crates/core" }
consoleui-ui = { path = "crates/ui" }
consoleui-app = { path = "crates/app" }

# Slint renders noticeably slower in debug builds otherwise; our own crates stay quick to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
