[workspace]
resolver = "3"
members = ["crates/core", "crates/shell"]
default-members = ["crates/shell"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
consoleui-core = { path = "crates/core" }

# Slint rendert im Debug-Build sonst spürbar langsamer; eigene Crates bleiben schnell kompilierbar.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
